<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHA CARE AI — Hybrid Quantum-Inspired Health Screening</title>

<style>
  :root{
    --void:#0a142e;
    --panel:#2d4069;
    --panel2:#182338;
    --border:rgba(255,255,255,0.09);
    --text:#EAF1FB;
    --dim:#93A2BD;
    --violet:#8B7CF6;
    --violet-dim:rgba(139,124,246,0.15);
    --teal:#33D6BD;
    --teal-dim:rgba(51,214,189,0.15);
    --amber:#F2A65A;
    --red:#EF5350;
    --red-dim:rgba(190, 67, 67, 0.14);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(139,124,246,0.10), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(51,214,189,0.08), transparent 40%),
      var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  [dir="rtl"] body{direction:rtl;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 28px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:50;
    background:rgba(10,15,28,0.85);
    backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;position:relative;flex:none;
  }
  .brand-mark svg{width:100%;height:100%;}
  .brand-name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .brand-name em{font-style:italic;color:var(--violet);}

  .lang-select-wrap{position:relative;}
  select.lang-select{
    appearance:none;background:var(--panel2);color:var(--text);
    border:1px solid var(--border);border-radius:999px;
    padding:9px 34px 9px 16px;font-size:13px;font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.02em;
  }
  [dir="rtl"] select.lang-select{padding:9px 16px 9px 34px;}
  .lang-select-wrap::after{
    content:'⌄';position:absolute;right:14px;top:50%;transform:translateY(-55%);
    color:var(--dim);pointer-events:none;font-size:14px;
  }
  [dir="rtl"] .lang-select-wrap::after{right:auto;left:14px;}

  /* ---------- shell ---------- */
  main{max-width:760px;margin:0 auto;padding:40px 20px 120px;}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--teal);background:var(--teal-dim);border:1px solid rgba(51,214,189,0.3);
    padding:6px 12px;border-radius:999px;margin-bottom:20px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  h1.hero{font-size:clamp(30px,5vw,44px);margin:0 0 14px;}
  p.sub{color:var(--dim);font-size:16px;max-width:52ch;margin:0 0 30px;}

  /* ---------- signature pulse->qubit line ---------- */
  .signature{width:100%;max-width:560px;margin:8px 0 34px;}
  .signature svg{width:100%;height:auto;display:block;}
  .sig-path{
    fill:none;stroke:url(#sigGrad);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:900;stroke-dashoffset:900;
    animation:draw 2.4s cubic-bezier(.4,0,.2,1) forwards;
  }
  .sig-node{fill:var(--violet);opacity:0;animation:nodeIn 0.6s ease forwards;}
  .sig-node.n1{animation-delay:1.6s;} .sig-node.n2{animation-delay:1.85s;}
  .sig-node.n3{animation-delay:2.1s;} .sig-node.n4{animation-delay:2.35s;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @keyframes nodeIn{to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .sig-path{stroke-dashoffset:0;animation:none;}
    .sig-node{opacity:1;animation:none;}
  }

  /* ---------- mood chips ---------- */
  .mood-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
  .chip{
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:500;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .chip:hover{border-color:var(--violet);transform:translateY(-1px);}
  .chip.selected{background:var(--violet-dim);border-color:var(--violet);color:#fff;}

  .btn-primary{
    background:linear-gradient(135deg,var(--violet),#6a5cf0);
    color:#fff;border:none;border-radius:12px;padding:14px 26px;
    font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 8px 24px -8px rgba(139,124,246,0.55);
    transition:transform .12s, box-shadow .12s;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(139,124,246,0.7);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-secondary{
    background:transparent;color:var(--dim);border:1px solid var(--border);
    border-radius:12px;padding:13px 22px;font-size:14.5px;font-weight:500;
  }
  .btn-secondary:hover{color:var(--text);border-color:var(--dim);}

  /* ---------- progress dots ---------- */
  .steps{display:flex;gap:6px;align-items:center;margin-bottom:34px;}
  .step-dot{
    flex:1;height:4px;border-radius:2px;background:var(--border);position:relative;overflow:hidden;
  }
  .step-dot.done{background:var(--teal);}
  .step-dot.active{background:var(--panel2);}
  .step-dot.active::after{
    content:'';position:absolute;inset:0;background:var(--violet);
    animation:fillstep 0.4s ease forwards;
  }
  @keyframes fillstep{from{width:0;}to{width:100%;}}
  .step-label-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:0.04em;margin-bottom:8px;text-transform:uppercase;}

  /* ---------- symptom grid ---------- */
  .symptom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:30px;}
  .symptom-card{
    border:1px solid var(--border);background:var(--panel);border-radius:14px;
    padding:16px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    transition:border-color .15s, background .15s;
    text-align:start;
  }
  .symptom-card:hover{border-color:rgba(139,124,246,0.5);}
  .symptom-card.selected{background:var(--violet-dim);border-color:var(--violet);}
  .symptom-card .ic{font-size:22px;}
  .symptom-card .lbl{font-size:13.5px;font-weight:500;line-height:1.3;}
  .symptom-card .check{
    margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;
  }
  [dir="rtl"] .symptom-card .check{margin-left:0;margin-right:auto;}
  .symptom-card.selected .check{background:var(--violet);border-color:var(--violet);color:#fff;}
  .symptom-top{display:flex;align-items:flex-start;width:100%;gap:8px;}

  /* ---------- question card ---------- */
  .qcard{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:34px 28px;margin-bottom:26px;
  }
  .qcount{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px;}
  .qtext{font-family:'Fraunces',serif;font-size:22px;font-weight:500;margin:0 0 26px;}
  .yn-row{display:flex;gap:12px;}
  .yn-btn{
    flex:1;padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);
    font-size:15px;font-weight:600;color:var(--text);transition:all .12s;
  }
  .yn-btn.yes:hover{border-color:var(--teal);background:var(--teal-dim);}
  .yn-btn.no:hover{border-color:var(--red);background:var(--red-dim);}

  /* ---------- results ---------- */
  .result-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 24px;margin-bottom:16px;
  }
  .result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;}
  .result-name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;}
  .result-pct{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--violet);white-space:nowrap;}
  .bar-track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));border-radius:3px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1);}
  .result-row{display:flex;gap:10px;font-size:14px;color:var(--dim);margin-bottom:8px;align-items:flex-start;}
  .result-row b{color:var(--text);font-weight:600;min-width:110px;flex:none;}
  .care-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}

  .banner{
    border-radius:14px;padding:18px 20px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start;
  }
  .banner.emergency{background:var(--red-dim);border:1px solid rgba(239,83,80,0.45);}
  .banner.info{background:var(--panel2);border:1px solid var(--border);}
  .banner .b-icon{font-size:22px;flex:none;}
  .banner h3{margin:0 0 6px;font-size:16px;}
  .banner p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.5;}
  .banner.emergency h3{color:var(--red);}
  .banner.emergency p{color:#f2c4c3;}

  /* ---------- reminders ---------- */
  .reminder-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:10px;}
  .field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field-row label{font-size:12.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
  input[type=text],input[type=datetime-local]{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:14px;font-family:inherit;width:100%;
  }
  input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.6;}
  .reminder-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;font-size:13.5px;
  }
  .reminder-item .rtime{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-size:12px;display:block;margin-top:2px;}
  .rm-del{background:none;border:none;color:var(--dim);font-size:13px;padding:4px 8px;}
  .rm-del:hover{color:var(--red);}

  /* ---------- sticky disclaimer ---------- */
  .disclaimer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(10,15,28,0.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding:12px 20px;text-align:center;font-size:12px;color:var(--dim);
  }
  .disclaimer-bar b{color:var(--amber);}

  footer.note{max-width:760px;margin:40px auto 90px;padding:0 20px;color:var(--dim);font-size:12.5px;text-align:center;}

  @media(max-width:520px){
    main{padding:26px 16px 130px;}
    .qcard{padding:24px 18px;}
    .result-top{flex-direction:column;}
  }
</style>
</head>

/* ============================= STATE ============================= */
const state = {
  lang: (navigator.language||'en').slice(0,2),
  screen: 'welcome',       // welcome | symptoms | questions | results
  mood: null,
  selectedSymptoms: new Set(),
  candidateQuestions: [],  // ordered list of question ids for this session
  qIndex: 0,
  answers: {},             // qid -> true/false
  results: [],             // computed on entering results
  reminders: []
};
if(!T[state.lang]) state.lang = 'en';

function t(key, vars){
  let str = (T[state.lang] && T[state.lang][key]) || T.en[key] || key;
  if(vars) Object.keys(vars).forEach(k=> str = str.replace('{'+k+'}', vars[k]));
  return str;
}

/* ============================= STORAGE (reminders) ============================= */
async function loadReminders(){
  try{
    const res = await window.storage.get('vitalq:reminders', false);
    state.reminders = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ state.reminders = []; }
  scheduleAllReminders();
}
async function saveReminders(){
  try{ await window.storage.set('vitalq:reminders', JSON.stringify(state.reminders), false); }catch(e){}
}
function scheduleAllReminders(){
  const now = Date.now();
  state.reminders.forEach(r=>{
    const delay = new Date(r.time).getTime() - now;
    if(delay > 0 && delay < 2147000000){
      setTimeout(()=> fireNotification(r.note), delay);
    }
  });
}
function fireNotification(note){
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('VitalQ', {body: note});
  }
}
async function addReminder(note, time){
  if('Notification' in window && Notification.permission === 'default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
  const r = {id: 'r'+Date.now(), note, time};
  state.reminders.push(r);
  await saveReminders();
  const delay = new Date(time).getTime() - Date.now();
  if(delay > 0 && delay < 2147000000) setTimeout(()=> fireNotification(note), delay);
  render();
}
async function deleteReminder(id){
  state.reminders = state.reminders.filter(r=>r.id!==id);
  await saveReminders();
  render();
}

/* ============================= SCORING ENGINE ============================= */
// Transparent rule-based weighted matching engine (quantum-inspired branding only —
// this is a deterministic scoring model, not an actual quantum computation).
function pickQuestions(){
  const selected = state.selectedSymptoms;
  const ranked = CONDITION_IDS
    .map(cid=>{
      const cond = CONDITIONS[cid];
      let overlap = 0;
      Object.keys(cond.symptoms).forEach(s=>{ if(selected.has(s)) overlap += cond.symptoms[s]; });
      return {cid, overlap};
    })
    .filter(c=>c.overlap>0)
    .sort((a,b)=>b.overlap-a.overlap);

  const topConditions = ranked.slice(0,5).map(c=>c.cid);
  const qset = [];
  topConditions.forEach(cid=>{
    CONDITIONS[cid].questions.forEach(q=>{ if(!qset.includes(q)) qset.push(q); });
  });
  // fallback: if too few symptom-driven questions, pad with generic ones
  QUESTION_IDS.forEach(q=>{ if(qset.length<10 && !qset.includes(q)) qset.push(q); });
  return qset.slice(0,10);
}

function computeResults(){
  const selected = state.selectedSymptoms;
  const scored = CONDITION_IDS.map(cid=>{
    const cond = CONDITIONS[cid];
    const symKeys = Object.keys(cond.symptoms);
    const maxSym = symKeys.reduce((a,k)=>a+cond.symptoms[k],0);
    let symScore = 0;
    symKeys.forEach(k=>{ if(selected.has(k)) symScore += cond.symptoms[k]; });

    let qScore = 0, qMax = 0;
    cond.questions.forEach(qid=>{
      qMax += 1.5;
      if(state.answers[qid] === true) qScore += 1.5;
      else if(state.answers[qid] === false) qScore -= 0.5;
    });
    const total = maxSym + qMax;
    const raw = total>0 ? (symScore+qScore)/total : 0;
    const pct = Math.max(0, Math.min(0.88, raw)); // cap at 88% — never claim certainty
    return {cid, pct};
  })
  .filter(r=>r.pct>0.12)
  .sort((a,b)=>b.pct-a.pct)
  .slice(0,3);

  return scored;
}

function hasEmergencyFlags(){
  const s = state.selectedSymptoms;
  return EMERGENCY_COMBOS.some(combo => combo.every(sym=>s.has(sym)));
}

/* ============================= RENDER ============================= */
function updateChrome(){
  document.getElementById('htmlRoot').lang = state.lang;
  document.getElementById('htmlRoot').dir = RTL.includes(state.lang) ? 'rtl' : 'ltr';
  document.getElementById('footerNote').textContent = t('footer_note');
  document.getElementById('disclaimerBar').innerHTML = '⚠ <b>'+t('disclaimer_short').split('.')[0]+'.</b> ' + t('disclaimer_short').split('.').slice(1).join('.').trim();
  const sel = document.getElementById('langSelect');
  if(!sel.options.length){
    LANGS.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = l.code; opt.textContent = l.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', e=>{ state.lang = e.target.value; render(); });
  }
  sel.value = state.lang;
}

function stepsBar(activeIdx){
  const labels = [t('step_feeling'),t('step_symptoms'),t('step_questions'),t('step_results'),t('step_care')];
  let dots = '<div class="step-label-row">'+labels.map((l,i)=>`<span style="opacity:${i<=activeIdx?1:0.4}">${l}</span>`).join('')+'</div><div class="steps">';
  for(let i=0;i<labels.length;i++){
    let cls = i<activeIdx?'done':(i===activeIdx?'active':'');
    dots += `<div class="step-dot ${cls}"></div>`;
  }
  dots += '</div>';
  return dots;
}

function emergencyBannerHTML(){
  if(!hasEmergencyFlags()) return '';
  return `<div class="banner emergency">
    <div class="b-icon">🚨</div>
    <div><h3>${t('emergency_title')}</h3><p>${t('emergency_body')}</p></div>
  </div>`;
}

function render(){
  updateChrome();
  const app = document.getElementById('app');
  if(state.screen === 'welcome') app.innerHTML = renderWelcome();
  else if(state.screen === 'symptoms') app.innerHTML = renderSymptoms();
  else if(state.screen === 'questions') app.innerHTML = renderQuestions();
  else if(state.screen === 'results') app.innerHTML = renderResults();
  attachHandlers();
  if(state.screen === 'results'){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.bar-fill').forEach(el=>{
        const pct = el.getAttribute('data-pct');
        requestAnimationFrame(()=>{ el.style.width = pct+'%'; });
      });
    });
  }
}

function renderWelcome(){
  const moods = [['good','mood_good'],['okay','mood_okay'],['unwell','mood_unwell'],['veryunwell','mood_veryunwell']];
  return `
    <div class="eyebrow"><span class="dot"></span>${t('brand_tag')}</div>
    <h1 class="hero">${t('hero_title')}</h1>
    <p class="sub">${t('hero_sub')}</p>
    <div class="signature">
      <svg viewBox="0 0 560 140">
        <defs>
          <linearGradient id="sigGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#33D6BD"/>
            <stop offset="55%" stop-color="#8B7CF6"/>
            <stop offset="100%" stop-color="#8B7CF6"/>
          </linearGradient>
        </defs>
        <path class="sig-path" d="M10,70 L70,70 L85,30 L100,110 L115,70 L160,70 L185,45 L210,95 L235,70
          L270,70 L300,40 L330,100 L360,70
          L385,70 L400,50 L420,90 L440,70 L470,70 L500,50 L530,70 L550,70"/>
        <circle class="sig-node n1" cx="385" cy="70" r="4.5"/>
        <circle class="sig-node n2" cx="440" cy="70" r="4.5"/>
        <circle class="sig-node n3" cx="500" cy="50" r="4.5"/>
        <circle class="sig-node n4" cx="550" cy="70" r="4.5"/>
      </svg>
    </div>
    <div class="mood-row">
      ${moods.map(([id,key])=>`<button class="chip ${state.mood===id?'selected':''}" data-mood="${id}">${t(key)}</button>`).join('')}
    </div>
    <button class="btn-primary" id="startBtn">${t('start_btn')} →</button>
  `;
}

function renderSymptoms(){
  return `
    ${stepsBar(1)}
    <h2 class="display" style="font-size:26px;margin:0 0 8px;">${t('symptoms_title')}</h2>
    <p class="sub" style="margin-bottom:24px;">${t('symptoms_sub')}</p>
    ${emergencyBannerHTML()}
    <div class="symptom-grid">
      ${SYMPTOM_IDS.map(id=>`
        <button class="symptom-card ${state.selectedSymptoms.has(id)?'selected':''}" data-symptom="${id}">
          <div class="symptom-top">
            <span class="ic">${SYMPTOM_ICONS[id]}</span>
            <span class="check">${state.selectedSymptoms.has(id)?'✓':''}</span>
          </div>
          <span class="lbl">${t('sym_'+id)}</span>
        </button>
      `).join('')}
    </div>
    ${state.selectedSymptoms.size===0 ? `<p class="sub" style="color:var(--amber);margin-bottom:16px;">${t('no_symptoms_note')}</p>` : ''}
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" id="backBtn">${t('back_btn')}</button>
      <button class="btn-primary" id="continueBtn" ${state.selectedSymptoms.size===0?'disabled':''}>${t('next_btn')} →</button>
    </div>
  `;
}

function renderQuestions(){
  const qid = state.candidateQuestions[state.qIndex];
  return `
    ${stepsBar(2)}
    ${emergencyBannerHTML()}
    <div class="qcard">
      <div class="qcount">${t('question_of',{n:state.qIndex+1,total:state.candidateQuestions.length})}</div>
      <h3 class="qtext">${t(qid)}</h3>
      <div class="yn-row">
        <button class="yn-btn yes" data-ans="true">${t('yes_btn')}</button>
        <button class="yn-btn no" data-ans="false">${t('no_btn')}</button>
      </div>
    </div>
    <button class="btn-secondary" id="backBtn">${t('back_btn')}</button>
  `;
}

function specialtyMapsUrl(specialtyLabel){
  const q = encodeURIComponent(specialtyLabel + ' doctor near me');
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function renderResults(){
  const results = state.results;
  const body = results.length ? results.map(r=>{
    const cond = CONDITIONS[r.cid];
    const pct = Math.round(r.pct*100);
    const specLabel = t('spec_'+cond.specialty);
    return `
      <div class="result-card">
        <div class="result-top">
          <h3 class="result-name">${t('cond_'+r.cid)}</h3>
          <div class="result-pct mono">${pct}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" data-pct="${pct}"></div></div>
        <div class="result-row"><b>${t('advice_label')}</b><span>${t('adv_'+r.cid)}</span></div>
        <div class="result-row"><b>${t('specialist_label')}</b><span>${specLabel}</span></div>
        <div class="care-actions">
          <button class="btn-primary find-doc-btn" data-specialty="${specLabel.replace(/"/g,'')}">📍 ${t('find_doctors_btn')}</button>
        </div>
      </div>
    `;
  }).join('') : `<div class="banner info"><div class="b-icon">ℹ️</div><div><p>${t('low_confidence')}</p></div></div>`;

  return `
    ${stepsBar(3)}
    ${emergencyBannerHTML()}
    <h2 class="display" style="font-size:26px;margin:0 0 6px;">${t('results_title')}</h2>
    <p class="sub" style="margin-bottom:24px;">${t('results_sub')}</p>
    ${body}

    <div class="reminder-box">
      <h3 class="display" style="font-size:18px;margin:0 0 4px;">${t('reminder_title')}</h3>
      <p class="sub" style="font-size:12.5px;margin-bottom:16px;">${t('notif_hint')}</p>
      <div class="field-row">
        <label>${t('reminder_label')}</label>
        <input type="text" id="reminderNote" placeholder="${t('reminder_note_placeholder')}">
      </div>
      <div class="field-row">
        <label>${t('reminder_time')}</label>
        <input type="datetime-local" id="reminderTime">
      </div>
      <button class="btn-primary" id="saveReminderBtn">${t('reminder_save')}</button>

      <h4 class="mono" style="font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;">${t('reminder_list_title')}</h4>
      ${state.reminders.length ? state.reminders.map(r=>`
        <div class="reminder-item">
          <div><div>${r.note}</div><span class="rtime">${new Date(r.time).toLocaleString()}</span></div>
          <button class="rm-del" data-id="${r.id}">${t('reminder_delete')}</button>
        </div>
      `).join('') : `<p class="sub" style="font-size:13px;">${t('reminder_empty')}</p>`}
    </div>

    <div style="margin-top:24px;">
      <button class="btn-secondary" id="restartBtn">${t('restart_btn')}</button>
    </div>
  `;
}

/* ============================= EVENTS ============================= */
function attachHandlers(){
  const app = document.getElementById('app');

  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{ state.screen='symptoms'; render(); });

  app.querySelectorAll('[data-mood]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.mood = btn.getAttribute('data-mood'); render(); });
  });

  app.querySelectorAll('[data-symptom]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-symptom');
      if(state.selectedSymptoms.has(id)) state.selectedSymptoms.delete(id);
      else state.selectedSymptoms.add(id);
      render();
    });
  });

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    if(state.screen==='symptoms'){ state.screen='welcome'; }
    else if(state.screen==='questions'){
      if(state.qIndex>0){ state.qIndex--; }
      else { state.screen='symptoms'; }
    }
    render();
  });

  const continueBtn = document.getElementById('continueBtn');
  if(continueBtn) continueBtn.addEventListener('click', ()=>{
    state.candidateQuestions = pickQuestions();
    state.qIndex = 0;
    state.answers = {};
    state.screen = 'questions';
    render();
  });

  app.querySelectorAll('.yn-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qid = state.candidateQuestions[state.qIndex];
      state.answers[qid] = btn.getAttribute('data-ans') === 'true';
      if(state.qIndex < state.candidateQuestions.length-1){
        state.qIndex++;
      } else {
        state.results = computeResults();
        state.screen = 'results';
      }
      render();
    });
  });

  app.querySelectorAll('.find-doc-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const specialty = btn.getAttribute('data-specialty');
      const openMaps = (lat,lng)=>{
        const q = encodeURIComponent(specialty + (lat ? ` near ${lat},${lng}` : ' near me'));
        window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
      };
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          pos=> openMaps(pos.coords.latitude, pos.coords.longitude),
          ()=> openMaps(null,null),
          {timeout:4000}
        );
      } else openMaps(null,null);
    });
  });

  const saveReminderBtn = document.getElementById('saveReminderBtn');
  if(saveReminderBtn) saveReminderBtn.addEventListener('click', ()=>{
    const note = document.getElementById('reminderNote').value.trim();
    const time = document.getElementById('reminderTime').value;
    if(note && time) addReminder(note, time);
  });

  app.querySelectorAll('.rm-del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteReminder(btn.getAttribute('data-id')));
  });

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{
    state.screen='welcome'; state.mood=null; state.selectedSymptoms=new Set();
    state.candidateQuestions=[]; state.qIndex=0; state.answers={}; state.results=[];
    render();
  });
}

/* ============================= INIT ============================= */
loadReminders().then(render);
</script>
</body>
</html>
